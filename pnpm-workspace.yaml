minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@iconify/json@2.2.534'

trustPolicy: off
shellEmulator: true

packages:
  - 'packages/*'

allowBuilds:
  core-js: true
  es5-ext: true
  esbuild: true
  json-editor-vue: true
  typeit: true
  vue-demi: true

onlyBuiltDependencies:
  - esbuild
  - json-editor-vue
  - vue-demi
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.0.0-rc.1
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
